<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
    :root, [data-theme="light"] {
      color-scheme: light;
      --bg: #f3f6f8;
      --bg-gradient: radial-gradient(1200px 600px at 15% -10%, rgba(16, 185, 129, 0.07), transparent 60%), radial-gradient(900px 500px at 90% 0%, rgba(15, 76, 129, 0.07), transparent 55%);
      --surface: #ffffff;
      --surface-2: #edf2f6;
      --surface-raised: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.86);
      --ink: #0f172a;
      --ink-2: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --accent: #0f4c81;
      --accent-hover: #0b3962;
      --accent-soft: #e0f2fe;
      --accent-ink: #ffffff;
      --emerald: #059669;
      --emerald-soft: #ecfdf5;
      --ok: #059669;
      --ok-bg: #ecfdf5;
      --ok-line: #a7f3d0;
      --warn: #d97706;
      --warn-bg: #fffbeb;
      --warn-line: #fde68a;
      --bad: #dc2626;
      --bad-bg: #fef2f2;
      --bad-line: #fecaca;
      --sample-bg: #fffbeb;
      --sample-line: #fde68a;
      --sample-ink: #92400e;
      --seg-1: #0f4c81;
      --seg-2: #0284c7;
      --seg-3: #0d9488;
      --seg-4: #6366f1;
      --seg-5: #8b5cf6;
      --seg-6: #64748b;
      --seg-spendable: #10b981;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.02);
      --shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 32px -8px rgba(15, 23, 42, 0.14), 0 8px 16px -6px rgba(15, 23, 42, 0.06);
      --r-xs: 8px;
      --r-sm: 12px;
      --r-md: 16px;
      --r-lg: 22px;
      --font-sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-display: "Source Serif 4", Georgia, serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #090e17;
        --bg-gradient: radial-gradient(1100px 550px at 15% -10%, rgba(16, 185, 129, 0.10), transparent 60%), radial-gradient(900px 500px at 90% 0%, rgba(56, 189, 248, 0.09), transparent 55%);
        --surface: #111827;
        --surface-2: #1e293b;
        --surface-raised: #172033;
        --surface-glass: rgba(17, 24, 39, 0.86);
        --ink: #f8fafc;
        --ink-2: #cbd5e1;
        --muted: #94a3b8;
        --line: #1e293b;
        --line-strong: #334155;
        --accent: #38bdf8;
        --accent-hover: #7dd3fc;
        --accent-soft: rgba(56, 189, 248, 0.14);
        --accent-ink: #082f49;
        --emerald: #34d399;
        --emerald-soft: rgba(52, 211, 153, 0.12);
        --ok: #34d399;
        --ok-bg: rgba(16, 185, 129, 0.12);
        --ok-line: rgba(52, 211, 153, 0.3);
        --warn: #fbbf24;
        --warn-bg: rgba(245, 158, 11, 0.12);
        --warn-line: rgba(251, 191, 36, 0.3);
        --bad: #f87171;
        --bad-bg: rgba(239, 68, 68, 0.12);
        --bad-line: rgba(248, 113, 113, 0.3);
        --sample-bg: rgba(245, 158, 11, 0.12);
        --sample-line: rgba(251, 191, 36, 0.35);
        --sample-ink: #fde68a;
        --seg-1: #38bdf8;
        --seg-2: #60a5fa;
        --seg-3: #2dd4bf;
        --seg-4: #818cf8;
        --seg-5: #a78bfa;
        --seg-6: #64748b;
        --seg-spendable: #34d399;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow: 0 6px 16px -2px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.65);
      }
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #090e17;
      --bg-gradient: radial-gradient(1100px 550px at 15% -10%, rgba(16, 185, 129, 0.10), transparent 60%), radial-gradient(900px 500px at 90% 0%, rgba(56, 189, 248, 0.09), transparent 55%);
      --surface: #111827;
      --surface-2: #1e293b;
      --surface-raised: #172033;
      --surface-glass: rgba(17, 24, 39, 0.86);
      --ink: #f8fafc;
      --ink-2: #cbd5e1;
      --muted: #94a3b8;
      --line: #1e293b;
      --line-strong: #334155;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --accent-ink: #082f49;
      --emerald: #34d399;
      --emerald-soft: rgba(52, 211, 153, 0.12);
      --ok: #34d399;
      --ok-bg: rgba(16, 185, 129, 0.12);
      --ok-line: rgba(52, 211, 153, 0.3);
      --warn: #fbbf24;
      --warn-bg: rgba(245, 158, 11, 0.12);
      --warn-line: rgba(251, 191, 36, 0.3);
      --bad: #f87171;
      --bad-bg: rgba(239, 68, 68, 0.12);
      --bad-line: rgba(248, 113, 113, 0.3);
      --sample-bg: rgba(245, 158, 11, 0.12);
      --sample-line: rgba(251, 191, 36, 0.35);
      --sample-ink: #fde68a;
      --seg-1: #38bdf8;
      --seg-2: #60a5fa;
      --seg-3: #2dd4bf;
      --seg-4: #818cf8;
      --seg-5: #a78bfa;
      --seg-6: #64748b;
      --seg-spendable: #34d399;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow: 0 6px 16px -2px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.65);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background-color: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 15.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .num, .money, [data-num] { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .skip-link {
      position: absolute; top: -100px; left: 12px; z-index: 200;
      padding: 10px 14px; background: var(--accent); color: var(--accent-ink);
      border-radius: var(--r-sm); text-decoration: none; font-weight: 600;
    }
    .skip-link:focus { top: 12px; }

    /* App shell & responsive layout */
    .shell {
      min-height: 100dvh;
      max-width: 780px;
      margin: 0 auto;
      padding: 16px 16px 104px;
    }
    @media (min-width: 960px) {
      .layout {
        display: grid;
        grid-template-columns: 256px minmax(0, 1fr);
        max-width: 1260px;
        margin: 0 auto;
        min-height: 100dvh;
      }
      .shell {
        max-width: 960px;
        width: 100%;
        padding: 28px 36px 72px;
      }
      .bottom-nav { display: none !important; }
      .side-nav { display: flex !important; }
      .mobile-only { display: none !important; }
    }

    /* Two-column dashboard grid on desktop */
    .dash-grid {
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr;
      align-items: start;
    }
    @media (min-width: 820px) {
      .dash-grid {
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      }
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 6px 2px 18px;
    }
    .topbar h1 {
      margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em;
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .wordmark {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 700; letter-spacing: -0.02em; font-size: 1.05rem;
      color: var(--ink);
    }
    .wordmark svg { color: var(--accent); flex: none; }

    .side-nav {
      display: none; flex-direction: column; justify-content: space-between;
      gap: 12px;
      padding: 26px 18px;
      border-right: 1px solid var(--line);
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; height: 100dvh;
    }
    .side-nav .wordmark { padding: 4px 10px 18px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
    .side-nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }

    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: var(--surface-glass);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
      padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.05);
    }
    .bottom-nav ul {
      list-style: none; margin: 0 auto; padding: 0; max-width: 600px;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px;
    }
    .nav-btn {
      width: 100%; border: 0; background: transparent; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; min-height: 50px; padding: 6px 4px; border-radius: var(--r-sm);
      font-size: 0.73rem; font-weight: 600; text-decoration: none;
      transition: all 0.15s ease;
    }
    .nav-btn:hover { background: var(--surface-2); color: var(--ink); }
    .nav-btn[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 700; }
    .side-nav .nav-btn {
      flex-direction: row; justify-content: flex-start; gap: 12px;
      padding: 10px 12px; font-size: 0.92rem; min-height: 44px;
    }
    .nav-icon { position: relative; display: inline-flex; }
    .badge-dot {
      position: absolute; top: -3px; right: -6px;
      min-width: 17px; height: 17px; padding: 0 4px;
      border-radius: 99px; background: var(--bad); color: #fff;
      font-size: 0.66rem; font-weight: 700; line-height: 17px; text-align: center;
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 42px; padding: 9px 16px;
      border-radius: var(--r-sm); border: 1px solid var(--line-strong);
      background: var(--surface-raised); color: var(--ink);
      font-weight: 600; font-size: 0.9rem; line-height: 1.2;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent); color: var(--accent-ink); border-color: transparent;
      box-shadow: 0 2px 8px rgba(15, 76, 129, 0.25);
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: transparent; }
    .btn-emerald {
      background: var(--emerald); color: #ffffff; border-color: transparent;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.25);
    }
    .btn-emerald:hover:not(:disabled) { filter: brightness(1.06); }
    .btn-danger {
      background: var(--bad); color: #fff; border-color: var(--bad);
    }
    .btn-danger:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-quiet {
      border-color: transparent; background: transparent; color: var(--accent);
      padding-inline: 10px; box-shadow: none;
    }
    .btn-quiet:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
    .btn-sm {
      min-height: 32px; padding: 5px 11px; font-size: 0.8rem; border-radius: var(--r-xs);
    }
    .btn-block { width: 100%; }
    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 40px; min-height: 40px; padding: 8px;
      border-radius: var(--r-sm); border: 1px solid var(--line);
      background: var(--surface); color: var(--ink); position: relative;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .icon-btn:hover { background: var(--surface-2); border-color: var(--line-strong); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    /* Cards & panels */
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: var(--shadow);
    }
    .panel-pad { padding: 20px; }
    .stack { display: grid; gap: 16px; }
    .stack-sm { display: grid; gap: 10px; }
    .content { display: grid; gap: 18px; }

    /* Upgraded Hero Card */
    .hero {
      padding: 24px 24px 22px;
      border-radius: var(--r-lg);
      background:
        radial-gradient(130% 110% at 100% 0%, var(--emerald-soft) 0%, transparent 55%),
        radial-gradient(120% 100% at 0% 100%, var(--accent-soft) 0%, transparent 60%),
        var(--surface);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow);
      display: grid; gap: 16px;
      position: relative;
      overflow: hidden;
    }
    .hero-top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .eyebrow {
      font-size: 0.74rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--muted); margin: 0;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .hero-main {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .hero-amount {
      display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px;
      margin: 0;
    }
    .hero-amount .figure {
      font-family: var(--font-display);
      font-size: clamp(2.65rem, 7vw, 3.85rem);
      font-weight: 700; line-height: 1; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    .hero-amount .per {
      font-size: 1.05rem; color: var(--muted); font-weight: 600;
    }
    .hero-sub {
      margin: 4px 0 0; color: var(--ink-2); font-size: 0.96rem;
      font-variant-numeric: tabular-nums;
    }
    .hero-sub strong { color: var(--ink); font-weight: 700; }

    /* Hero KPI Strip */
    .hero-kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px;
      padding: 12px;
      background: var(--surface-2);
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
    }
    .kpi-cell {
      display: flex; flex-direction: column; gap: 2px;
      padding: 4px 8px;
      border-radius: var(--r-xs);
      text-align: left;
      background: transparent;
      border: 0;
      transition: background 0.15s ease;
    }
    button.kpi-cell:hover { background: var(--surface); }
    .kpi-label {
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--muted);
    }
    .kpi-val {
      font-size: 1.08rem; font-weight: 700; color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .kpi-sub {
      font-size: 0.75rem; color: var(--muted);
    }

    /* Quick Action Bar & Preset Pills */
    .quick-bar {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      display: grid; gap: 12px;
    }
    .quick-bar-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .quick-pills {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 99px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2); color: var(--ink);
      font-size: 0.83rem; font-weight: 600;
      transition: all 0.15s ease;
    }
    .pill-btn:hover {
      background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
      transform: translateY(-1px);
    }
    .pill-btn .pill-amt {
      font-variant-numeric: tabular-nums;
      color: var(--muted); font-weight: 500;
    }

    /* Inline Quick Check Widget */
    .inline-check {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding-top: 8px; border-top: 1px solid var(--line);
    }
    .inline-check-input {
      position: relative; flex: 1 1 160px; min-width: 140px;
    }
    .inline-check-input span {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-weight: 600; pointer-events: none;
    }
    .inline-check-input input {
      width: 100%; height: 38px; padding: 6px 12px 6px 26px;
      border-radius: var(--r-xs); border: 1px solid var(--line-strong);
      background: var(--surface-2); font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .inline-verdict {
      flex: 1 1 220px; font-size: 0.84rem; padding: 7px 12px;
      border-radius: var(--r-xs); display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .inline-verdict.fit { background: var(--ok-bg); color: var(--ink); border: 1px solid var(--ok-line); }
    .inline-verdict.tight { background: var(--warn-bg); color: var(--ink); border: 1px solid var(--warn-line); }
    .inline-verdict.no { background: var(--bad-bg); color: var(--ink); border: 1px solid var(--bad-line); }

    /* Status chips */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 99px;
      font-size: 0.76rem; font-weight: 600; line-height: 1.2;
      border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
    }
    .chip-dot { width: 7px; height: 7px; border-radius: 99px; background: currentColor; }
    .chip-ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
    .chip-warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
    .chip-bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
    .chip-accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

    /* Cash Allocation Bar */
    .split { display: grid; gap: 14px; }
    .split-bar {
      display: flex; height: 16px; border-radius: 99px; overflow: hidden;
      background: var(--surface-2); border: 1px solid var(--line);
      gap: 2px; padding: 2px;
    }
    .split-bar > span { display: block; height: 100%; min-width: 4px; border-radius: 99px; transition: width 0.3s ease; }
    .seg-bills { background: var(--seg-1); }
    .seg-essentials { background: var(--seg-2); }
    .seg-savings { background: var(--seg-3); }
    .seg-debt { background: var(--seg-4); }
    .seg-buffer { background: var(--seg-5); }
    .seg-other { background: var(--seg-6); }
    .seg-spendable { background: var(--seg-spendable); }

    .split-legend {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 8px;
    }
    .legend-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 7px 10px; border-radius: var(--r-xs);
      background: var(--surface-2); border: 1px solid transparent;
      font-size: 0.82rem; text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    button.legend-item:hover { border-color: var(--line-strong); background: var(--surface); }
    .swatch {
      display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none;
    }

    /* Section headers */
    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 8px; margin-bottom: 4px;
    }
    .section-title {
      margin: 0; font-size: 0.82rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    }

    /* Ledger rows (clean summary & item lists) */
    .ledger { list-style: none; margin: 0; padding: 0; }
    .ledger > li + li { border-top: 1px solid var(--line); }
    .ledger-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 13px 16px; width: 100%;
      background: transparent; border: 0; text-align: left;
      color: var(--ink); text-decoration: none;
      transition: background 0.12s ease;
    }
    button.ledger-row:hover, a.ledger-row:hover { background: var(--surface-2); }
    .ledger-row .ledger-label { min-width: 0; flex: 1; }
    .ledger-row .ledger-label .name {
      font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis;
    }
    .ledger-row .ledger-label .sub {
      font-size: 0.82rem; color: var(--muted); display: block; margin-top: 2px;
    }
    .ledger-row .ledger-value {
      font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap;
      text-align: right; display: flex; flex-direction: column; align-items: flex-end;
    }
    .ledger-row .ledger-value .sub {
      font-size: 0.76rem; color: var(--muted); font-weight: 400;
    }
    .ledger.indent .ledger-row { padding-left: 28px; }

    /* Allowance Mini Progress Bar */
    .mini-progress {
      width: 100%; max-width: 180px; height: 6px; border-radius: 99px;
      background: var(--surface-2); overflow: hidden; margin-top: 5px;
      border: 1px solid var(--line);
    }
    .mini-progress > span {
      display: block; height: 100%; border-radius: 99px;
      background: var(--seg-2); transition: width 0.25s ease;
    }

    /* Calculation tape (Show My Math) */
    .tape { font-variant-numeric: tabular-nums; }
    .tape-section { padding: 16px 20px; }
    .tape-section + .tape-section { border-top: 1px solid var(--line); }
    .tape-head {
      font-size: 0.76rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px;
    }
    .tape-line {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; padding: 7px 6px; font-size: 0.93rem;
      border: 0; background: transparent; width: 100%; text-align: left;
      border-radius: var(--r-xs);
    }
    button.tape-line:hover { background: var(--surface-2); }
    .tape-line .lbl { color: var(--ink-2); min-width: 0; flex: 1; }
    .tape-line .lbl small { display: block; color: var(--muted); font-size: 0.78rem; }
    .tape-line .amt { font-family: var(--font-mono); font-weight: 500; white-space: nowrap; }
    .tape-line.excluded { opacity: 0.6; }
    .tape-subtotal, .tape-total {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; padding: 10px 6px 2px; margin-top: 6px;
      border-top: 1px dashed var(--line-strong);
      font-weight: 700;
    }
    .tape-total {
      border-top: 2px solid var(--ink);
      font-size: 1.08rem; padding-top: 12px;
    }
    .tape-total .amt, .tape-subtotal .amt { font-family: var(--font-mono); }

    /* Banners & alerts */
    .banner {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 13px 16px; border-radius: var(--r-md);
      border: 1px solid var(--line); background: var(--surface);
      font-size: 0.9rem; box-shadow: var(--shadow-sm);
    }
    .banner-icon { flex: none; margin-top: 2px; }
    .banner-body { flex: 1; min-width: 0; }
    .banner-title { font-weight: 700; margin: 0 0 2px; }
    .banner-text { margin: 0; color: var(--ink-2); font-size: 0.86rem; }
    .banner-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .banner-problem { background: var(--bad-bg); border-color: var(--bad-line); }
    .banner-problem .banner-icon, .banner-problem .banner-title { color: var(--bad); }
    .banner-caution { background: var(--warn-bg); border-color: var(--warn-line); }
    .banner-caution .banner-icon, .banner-caution .banner-title { color: var(--warn); }
    .banner-ok { background: var(--ok-bg); border-color: var(--ok-line); }
    .banner-ok .banner-icon, .banner-ok .banner-title { color: var(--ok); }
    .banner-sample {
      background: var(--sample-bg); border-color: var(--sample-line); color: var(--sample-ink);
    }
    .banner-sample .banner-title, .banner-sample .banner-text { color: var(--sample-ink); }
    .sample-flag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px; border-radius: 99px;
      background: var(--sample-bg); border: 1px solid var(--sample-line); color: var(--sample-ink);
      font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    }

    /* Forms */
    .form { display: grid; gap: 14px; }
    .field { display: grid; gap: 5px; }
    .field-row { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 520px) {
      .field-row.two { grid-template-columns: 1fr 1fr; }
    }
    .label { font-weight: 600; font-size: 0.88rem; color: var(--ink); }
    .hint { font-size: 0.8rem; color: var(--muted); margin: 0; }
    .field-error { font-size: 0.82rem; color: var(--bad); font-weight: 600; margin: 0; }
    .input, .select, .textarea {
      width: 100%; min-height: 44px; padding: 9px 12px;
      border-radius: var(--r-sm); border: 1px solid var(--line-strong);
      background: var(--surface); color: var(--ink);
      font-size: 0.96rem; transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      outline: none;
    }
    .input[aria-invalid="true"], .select[aria-invalid="true"] { border-color: var(--bad); }
    .textarea { min-height: 84px; resize: vertical; }
    .money-wrap { position: relative; display: flex; align-items: center; }
    .money-wrap .prefix {
      position: absolute; left: 12px; color: var(--muted);
      font-family: var(--font-mono); pointer-events: none; font-weight: 600;
    }
    .money-wrap .input {
      padding-left: 28px; font-variant-numeric: tabular-nums;
    }
    .money-wrap.big .input {
      font-size: 1.55rem; font-weight: 700; min-height: 56px; padding-left: 32px;
    }
    .money-wrap.big .prefix { font-size: 1.35rem; left: 14px; }

    /* Search input */
    .search-bar {
      position: relative; display: flex; align-items: center;
    }
    .search-bar svg {
      position: absolute; left: 12px; color: var(--muted); pointer-events: none;
    }
    .search-bar input {
      width: 100%; min-height: 42px; padding: 8px 34px 8px 38px;
      border-radius: var(--r-sm); border: 1px solid var(--line-strong);
      background: var(--surface); color: var(--ink); font-size: 0.92rem;
    }
    .search-clear {
      position: absolute; right: 8px; border: 0; background: transparent;
      color: var(--muted); padding: 4px; border-radius: 99px;
    }

    /* Switch / toggle */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 8px 0;
    }
    .toggle-row .toggle-text { min-width: 0; flex: 1; }
    .toggle-row .toggle-text .label { display: block; }
    .switch {
      position: relative; inline-size: 46px; block-size: 26px; flex: none;
      border-radius: 99px; border: 1px solid var(--line-strong);
      background: var(--surface-2); padding: 2px;
      display: inline-flex; align-items: center; transition: background 0.15s ease;
    }
    .switch[data-checked] { background: var(--accent); border-color: var(--accent); }
    .switch-thumb {
      width: 20px; height: 20px; border-radius: 99px;
      background: #fff; transition: transform 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }
    .switch[data-checked] .switch-thumb { transform: translateX(20px); }

    /* Segmented radio pills */
    .segmented {
      display: inline-flex; flex-wrap: wrap; gap: 4px;
      padding: 4px; border-radius: var(--r-sm);
      background: var(--surface-2); border: 1px solid var(--line);
    }
    .segmented button {
      border: 0; background: transparent; color: var(--ink-2);
      padding: 6px 12px; border-radius: calc(var(--r-sm) - 3px);
      font-size: 0.84rem; font-weight: 600; min-height: 34px;
      transition: all 0.12s ease;
    }
    .segmented button[aria-pressed="true"] {
      background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm);
    }

    /* Filter chips */
    .filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .filters button {
      border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-2); padding: 6px 13px; border-radius: 99px;
      font-size: 0.82rem; font-weight: 600; min-height: 34px;
      transition: all 0.12s ease;
    }
    .filters button[aria-pressed="true"] {
      background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    }

    /* Dialogs (Headless UI) */
    .dialog-backdrop {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(9, 14, 23, 0.55);
      backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0;
    }
    @media (min-width: 600px) {
      .dialog-backdrop { align-items: center; padding: 20px; }
    }
    .dialog-panel {
      width: 100%; max-width: 540px; max-height: 92dvh; overflow-y: auto;
      background: var(--surface); color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      box-shadow: var(--shadow-lg);
      padding: 20px 22px 26px;
    }
    @media (min-width: 600px) {
      .dialog-panel { border-radius: var(--r-lg); }
    }
    .dialog-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding-bottom: 12px; margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .dialog-title { margin: 0; font-size: 1.12rem; font-weight: 700; }

    /* Onboarding */
    .ob { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; display: grid; gap: 18px; }
    .ob-progress { display: grid; gap: 6px; }
    .ob-bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    .ob-bar > span { display: block; height: 100%; background: var(--accent); transition: width 0.25s ease; }
    .ob h2 { margin: 4px 0 0; font-family: var(--font-display); font-size: 1.7rem; line-height: 1.2; }
    .ob-actions {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; padding-top: 10px; border-top: 1px solid var(--line);
    }
    .radio-cards { display: grid; gap: 10px; }
    .radio-card {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px 16px; border-radius: var(--r-md);
      border: 1px solid var(--line-strong); background: var(--surface);
      text-align: left; width: 100%;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .radio-card[aria-checked="true"] {
      border-color: var(--accent); background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .radio-card .rc-title { font-weight: 700; display: block; }
    .radio-card .rc-sub { font-size: 0.85rem; color: var(--ink-2); display: block; margin-top: 2px; }

    /* Empty states */
    .empty {
      text-align: center; padding: 28px 18px; color: var(--muted);
      display: grid; gap: 8px; justify-items: center;
    }
    .empty-title { font-weight: 700; color: var(--ink-2); margin: 0; }
    .empty p { margin: 0; font-size: 0.88rem; max-width: 40ch; }

    /* Charts & tables */
    .chart-wrap { width: 100%; overflow-x: auto; }
    .chart { display: block; width: 100%; height: auto; }
    .chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-mono); }
    .chart .grid { stroke: var(--line); stroke-dasharray: 2 3; }
    .chart .bar { fill: var(--seg-4); }
    .chart .bar-ess { fill: var(--seg-3); }
    .chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .chart .dot { fill: var(--accent); }
    .table-wrap { overflow-x: auto; }
    table.data { width: 100%; border-collapse: collapse; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
    table.data th, table.data td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    table.data th { color: var(--muted); font-weight: 600; font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.04em; }
    table.data td:not(:first-child), table.data th:not(:first-child) { text-align: right; }

    /* Affordability verdict */
    .verdict {
      padding: 18px 20px; border-radius: var(--r-md); border: 1px solid var(--line);
      display: grid; gap: 8px;
    }
    .verdict h3 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .verdict p { margin: 0; }
    .verdict-fit { background: var(--ok-bg); border-color: var(--ok-line); }
    .verdict-fit h3 { color: var(--ok); }
    .verdict-tight { background: var(--warn-bg); border-color: var(--warn-line); }
    .verdict-tight h3 { color: var(--warn); }
    .verdict-no { background: var(--bad-bg); border-color: var(--bad-line); }
    .verdict-no h3 { color: var(--bad); }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 82px; transform: translateX(-50%);
      z-index: 70; padding: 10px 18px; border-radius: 99px;
      background: var(--ink); color: var(--surface);
      font-size: 0.86rem; font-weight: 600; box-shadow: var(--shadow-lg);
      max-width: calc(100vw - 32px);
    }
    @media (min-width: 960px) { .toast { bottom: 28px; } }

    /* Misc utilities */
    .muted { color: var(--muted); }
    .small { font-size: 0.85rem; }
    .tiny { font-size: 0.77rem; }
    .row { display: flex; align-items: center; gap: 8px; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .spacer { flex: 1; }
    .grid-2 { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 0.9rem; margin: 0; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
    .date-head {
      padding: 8px 4px 4px; font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
      margin: 0;
    }
    .code-box {
      font-family: var(--font-mono); font-size: 0.78rem;
      background: var(--surface-2); padding: 10px; border-radius: var(--r-sm);
      max-height: 220px; overflow: auto; word-break: break-all;
    }
    .lock-screen {
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px 16px;
      max-width: 420px; margin: 0 auto; gap: 16px; text-align: center;
    }
    .lock-screen form { width: 100%; text-align: left; }
    .welcome-figure {
      font-family: var(--font-display); font-size: 2rem; font-weight: 600;
      line-height: 1.25; margin: 4px 0;
    }
    .formula {
      font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.65;
      padding: 14px; border-radius: var(--r-sm); background: var(--surface-2);
      border: 1px solid var(--line); overflow-x: auto; margin: 0;
    }
    .loading {
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.95rem; gap: 10px;
    }
    .spinner {
      width: 18px; height: 18px; border-radius: 99px;
      border: 2px solid var(--line-strong); border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    .kbd {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 1px 6px; border-radius: 4px;
      border: 1px solid var(--line-strong); background: var(--surface-2);
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
    }
    details.CleanDetails > summary {
      list-style: none; cursor: pointer;
    }
    details.CleanDetails > summary::-webkit-details-marker { display: none; }

<style>/* Layout: one calm column on phones with a bottom tab bar; a compact left rail on wide screens.
   Ledger conventions borrowed from accounting working papers: tabular figures, a single rule
   before a subtotal and a double rule under the final total. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #e9edf2;
  --ink: #132035;
  --ink-2: #44526a;
  --ink-3: #56637a;
  --line: #d3dae4;
  --line-strong: #aeb9c8;
  --accent: #2b5a8c;
  --accent-ink: #ffffff;
  --accent-soft: #e2eaf4;
  --ok: #24654a;
  --ok-soft: #e0efe8;
  --warn: #855600;
  --warn-soft: #f8edd3;
  --bad: #a4241d;
  --bad-soft: #f8e2e0;
  --focus: #1b62c4;
  --shadow: 0 1px 2px rgba(19, 32, 53, 0.06), 0 4px 16px rgba(19, 32, 53, 0.05);
  --seg-1: #6f8fb3;
  --seg-2: #8aa5c4;
  --seg-3: #a7bcd4;
  --seg-4: #5b7aa0;
  --seg-5: #c3d2e3;
  --seg-6: #4a688d;
  --font-ui: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-display: 'Source Serif 4', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r: 14px;
  --r-sm: 10px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0c131e;
    --surface: #131c29;
    --surface-2: #1a2535;
    --ink: #e5eaf1;
    --ink-2: #b0bccb;
    --ink-3: #98a5b8;
    --line: #283447;
    --line-strong: #3a4a61;
    --accent: #8db4e0;
    --accent-ink: #0c131e;
    --accent-soft: #1c2d44;
    --ok: #7fcaa6;
    --ok-soft: #132f28;
    --warn: #e8bd66;
    --warn-soft: #352912;
    --bad: #f1958d;
    --bad-soft: #3a1c1b;
    --focus: #8cc0ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    --seg-1: #4f6d93;
    --seg-2: #61809f;
    --seg-3: #3e5a7c;
    --seg-4: #7392b5;
    --seg-5: #2f4762;
    --seg-6: #86a3c3;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0c131e;
  --surface: #131c29;
  --surface-2: #1a2535;
  --ink: #e5eaf1;
  --ink-2: #b0bccb;
  --ink-3: #98a5b8;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: '';
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num, .money { font-variant-numeric: tabular-nums lining-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 8px; }
.skip-link:focus { top: 8px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------------- shell ---------------- */
.shell { max-width: 620px; margin: 0 auto; padding-block: 12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); min-height: 100%; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 8px; min-height: 52px; padding-block: 4px; }
.topbar h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; letter-spacing: -0.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; letter-spacing: -0.01em; flex: 1; display: flex; align-items: center; gap: 8px; }
.wordmark svg { color: var(--accent); }
.content { display: grid; gap: 16px; }
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
}
.bottom-nav ul { list-style: none; margin: 0 auto; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); max-width: 620px; }
