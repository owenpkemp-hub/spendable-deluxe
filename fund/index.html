<script>
'use strict';

const pad = n => String(n).padStart(2, '0');

const isValidDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && ymd(parseD(s)) === s;
const round2 = v => Math.round(v * 100) / 100;
const fmtD = (s, o = { month: 'short', day: 'numeric', year: 'numeric' }) => parseD(s).toLocaleDateString(undefined, o);
function parseAmount(raw) {
  let s = String(raw ?? '').trim().replace(/[\s  ']/g, ''); const neg = /^-|^\(/.test(s);
  s = s.replace(/[^\d.,]/g, ''); if (!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc > -1) s = (s.split(',').length > 2 || s.length - lc - 1 === 3) ? s.replace(/,/g, '') : s.replace(',', '.');
  const v = parseFloat(s); return isNaN(v) ? NaN : neg ? -v : v;
}
const fc = {};
function money(v, opt = {}) {
  const k = DB.currency + JSON.stringify(opt);
  if (!fc[k]) { const o = { style: 'currency', currency: DB.currency }; if (opt.whole) { o.maximumFractionDigits = 0; o.minimumFractionDigits = 0; } if (opt.sign) o.signDisplay = 'exceptZero'; try { fc[k] = new Intl.NumberFormat(undefined, o); } catch (e) { fc[k] = { format: x => '$' + x.toFixed(2) }; } }
  return fc[k].format(Object.is(v, -0) ? 0 : v);
}
const CURRENCIES = (() => { try { return Intl.supportedValuesOf('currency'); } catch (e) { return ['USD', 'EUR', 'GBP', 'CAD', 'AUD', 'NZD', 'JPY', 'CHF', 'INR', 'MXN', 'BRL', 'ZAR', 'SGD', 'SEK', 'NOK', 'DKK']; } })();
function guessCurrency() { try { const r = new Intl.Locale(navigator.language || 'en-US').maximize().region; return ({ US: 'USD', GB: 'GBP', CA: 'CAD', AU: 'AUD', NZ: 'NZD', IN: 'INR', JP: 'JPY', CH: 'CHF', MX: 'MXN', BR: 'BRL', ZA: 'ZAR', SG: 'SGD', SE: 'SEK', NO: 'NOK', DK: 'DKK' })[r] || (['DE', 'FR', 'ES', 'IT', 'NL', 'IE', 'PT', 'BE', 'AT', 'FI', 'GR'].includes(r) ? 'EUR' : 'USD'); } catch (e) { return 'USD'; } }

const KEY = 'fu-fund-v1';
let DB = null;
function blank() { return { v: 1, setup: false, name: 'Fuck You Fund', currency: guessCurrency(), monthly: 0, goalMode: 'months', goalMonths: 6, goalAmount: 0, contrib: { amount: 0, day: 1, auto: false, next: null }, entries: [], celebrated: [], theme: 'auto', range: '1Y', installedAt: Date.now() }; }

/* ===== model ===== */
const balance = (upTo) => round2(DB.entries.reduce((s, e) => (!upTo || e.date <= upTo) ? s + e.amount : s, 0));

const monthsOf = v => DB.monthly > 0 ? v / DB.monthly : null;
function walkAwayDate(months) { const whole = Math.floor(months); const d = addMonths(today(), whole, parseD(today()).getDate()); return addDays(d, Math.round((months - whole) * 30.44)); }

function avgMonthlyNet() { const since = addDays(today(), -90); const s = DB.entries.filter(e => e.date >= since).reduce((a, e) => a + e.amount, 0); return s / 3; }

  if (!(rate > 0)) return { none: true };
  const n = Math.ceil((g - b) / rate);
  return { months: n, date: addMonths(today(), n), rate, planned: DB.contrib.amount > 0 };

function milestones() {
  const g = goal();
  if (DB.monthly > 0) { const goalM = DB.goalMode === 'months' ? DB.goalMonths : Math.max(1, Math.round(g / DB.monthly)); const set = [...[1, 3, 6, 12, 24].filter(m => m < goalM).slice(-3), goalM]; return set.map(m => ({ key: 'm' + m, label: m >= 12 && m % 12 === 0 ? `${m / 12} yr` : `${m} mo`, amount: m * DB.monthly, sub: m === goalM ? 'Goal' : 'freedom' })); }
  if (!g) return [];

}

  let g = 0; while (c.next <= today() && g++ < 240) { DB.entries.push({ id: uid(), date: c.next, amount: round2(c.amount), note: 'Monthly contribution', auto: true, created: Date.now() + n }); n++; c.next = addMonths(c.next, 1, c.day); }
  return n;

function checkMilestones(prevBal) {

}

/* ===== UI ===== */
const GEAR = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
let showAll = false, chartPts = [];
function render() {

function series() {
  const t = today(); const first = DB.entries.reduce((m, e) => e.date < m ? e.date : m, t);
  const from = DB.range === '3M' ? addDays(t, -90) : DB.range === '1Y' ? addDays(t, -364) : first;
  const start = from < first ? from : from; const delta = {}; let v = 0;
  for (const e of DB.entries) { if (e.date < start) v += e.amount; else if (e.date <= t) delta[e.date] = (delta[e.date] || 0) + e.amount; }
  const pts = []; for (let d = start; d <= t; d = addDays(d, 1)) { v += delta[d] || 0; pts.push({ d, v: round2(v) }); }
  if (pts.length < 2) pts.unshift({ d: addDays(start, -1), v: 0 });
  return pts;
}
function drawChart() {
  const pts = chartPts = series(); const W = 340, H = 150, P = { t: 10, b: 20 };
  const g = goal(); let min = Math.min(0, ...pts.map(p => p.v)), max = Math.max(...pts.map(p => p.v), g > 0 && g < Math.max(...pts.map(p => p.v)) * 1.6 ? g : 0, 1);
  const X = i => i / (pts.length - 1) * W, Y = v => P.t + (1 - (v - min) / (max - min)) * (H - P.t - P.b);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('');
  const lab = i => fmtD(pts[i].d, DB.range === '3M' ? { month: 'short', day: 'numeric' } : { month: 'short', year: '2-digit' });
  const goalLine = g > 0 && g <= max ? `<line x1="0" x2="${W}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--gold)" stroke-dasharray="4 4" opacity=".6"/><text x="${W}" y="${Y(g) - 4}" text-anchor="end">goal</text>` : '';
  $('#chart').innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" id="chartsvg"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".35"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>${goalLine}
    <path d="${d}L${W} ${H - P.b}L0 ${H - P.b}Z" fill="url(#ar)"/><path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="0" y="${H - 4}">${lab(0)}</text><text x="${W / 2}" y="${H - 4}" text-anchor="middle">${lab(Math.floor(pts.length / 2))}</text><text x="${W}" y="${H - 4}" text-anchor="end">${lab(pts.length - 1)}</text>
    <g id="cur" style="display:none"><line y1="${P.t}" y2="${H - P.b}" stroke="var(--muted)"/><circle r="5" fill="var(--gold)" stroke="var(--card)" stroke-width="2"/></g></svg>`;
  const first = pts[0].v, last = pts[pts.length - 1].v, ch = last - first;
  const def = `<b class="num">${money(last)}</b>${Math.abs(ch) >= .005 ? `<span class="${ch > 0 ? 'pos' : 'neg'} num">${money(ch, { sign: true })}</span> over ${DB.range === 'All' ? 'all time' : 'the past ' + (DB.range === '3M' ? '3 months' : 'year')}` : 'No change in this range'}`;
  $('#readout').innerHTML = def;
  const svg = $('#chartsvg'), cur = $('#cur');
  const show = ev => { const r = svg.getBoundingClientRect(); const i = Math.max(0, Math.min(pts.length - 1, Math.round((ev.clientX - r.left) / r.width * (pts.length - 1)))); cur.style.display = ''; cur.querySelector('line').setAttribute('x1', X(i)); cur.querySelector('line').setAttribute('x2', X(i)); const c = cur.querySelector('circle'); c.setAttribute('cx', X(i)); c.setAttribute('cy', Y(pts[i].v)); $('#readout').innerHTML = `<b class="num">${money(pts[i].v)}</b>${fmtD(pts[i].d, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}`; };
  const hide = () => { cur.style.display = 'none'; $('#readout').innerHTML = def; };
  svg.addEventListener('pointerdown', show); svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) show(e); }); svg.addEventListener('pointerleave', hide); svg.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') setTimeout(hide, 1500); });
}

function theme() { const t = DB.theme || 'auto'; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'add') entrySheet('in'); else if (act === 'out') entrySheet('out');
  else if (act === 'settings') settingsSheet();
  else if (act === 'range') { DB.range = a.dataset.r; save(); render(); }
  else if (act === 'all') { showAll = !showAll; render(); }
  else if (act === 'edit') { const x = DB.entries.find(y => y.id === a.dataset.id); if (x) entrySheet(null, x); }
  else if (act === 'backup') backup();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === 'Enter' && e.target.closest('.sheet') && e.target.tagName === 'INPUT') { const b = $('#e-save') || $('#s-save'); if (b) b.click(); } });

(async function boot() {
  load(); await recover(); theme();
  if (DB.setup) { const prev = balance(); const n = processAuto(); if (n) { save(); setTimeout(() => toast(`Added ${n} monthly contribution${n > 1 ? 's' : ''}`), 400); } render(); checkMilestones(prev); } else render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
</body>
</html>
